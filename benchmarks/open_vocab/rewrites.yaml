# Open-vocabulary rewrites of the benchmark instructions (journal study).
#
# One entry per distinct template instruction (site, task id, text); the
# builder (scripts/build_open_vocab_set.py) expands each to every robot
# that received that text and attaches the task's ground truth from
# results/<site>/batch_all.json. Each rewrite must keep that truth:
# the same goal category, the same hazard (or none), the same margin in
# metres, the same priority.
#
# Levels
#   paraphrase  same content, different words; unseen names for things
#   free_form   conversational; constraint embedded mid-sentence, units vary
#   implicit    things named by use or context; priority implied, not stated
#
# Drafted 2026-11-03 by Claude (Opus 5.5, the coding assistant; not one of
# the evaluated models) for the user's review. Names avoid the lexical
# synonym table and the category definitions shown to the models.
#
# Revised after the first local pilot (Llama-3.1-8B, 2026-11-03) only where
# the intended answer was ambiguous (3 sentences: a 'safety' word in an
# efficiency task, a lab 'sample-prep' counter read as equipment, 'kit
# boxes' colliding with the stacked-boxes name for stored material). Model
# errors were left as they are, and the prompt was not changed.

