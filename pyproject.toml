[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "body-aware-nav"
version = "1.0.0"
description = "Open-vocabulary embodied grounding with large language models for safe path planning of heterogeneous robots"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "open3d>=0.18",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=2.0"]
segmentation = ["torch>=2.0", "segment-anything>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["bodynav*"]

[tool.ruff]
line-length = 100
target-version = "py310"
